[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tjx-retail-image-search-poc"
version = "0.1.0"
description = "Synthetic retail image and natural-language search proof of concept"
requires-python = ">=3.11,<3.14"
dependencies = [
	"azure-cosmos>=4.9,<5",
	"azure-identity>=1.24,<2",
	"azure-search-documents>=11.6.0b12,<12",
	"azure-storage-blob>=12.26,<13",
	"fastapi>=0.116,<1",
	"httpx>=0.28,<1",
	"openai>=1.99,<2",
	"pillow>=11.3,<12",
	"pydantic>=2.11,<3",
	"pydantic-settings>=2.10,<3",
	"pyjwt[crypto]>=2.10,<3",
	"uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.4,<9",
	"pytest-asyncio>=1.1,<2",
	"ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires explicit Azure integration configuration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
